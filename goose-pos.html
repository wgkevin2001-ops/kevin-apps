<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦢 鵝肉餐廳 POS系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{
  --bg:#0d1117;--surface:#161b22;--card:#1c2333;--border:rgba(255,255,255,.07);
  --gold:#f5a623;--mint:#3de8c8;--pink:#ff6b9d;--blue:#58a6ff;--purple:#bc8cff;
  --red:#e94560;--green:#2ecc71;--text:#e6edf3;--dim:#8b949e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
button{font-family:inherit;cursor:pointer;}

/* NAV */
#nav{display:flex;background:var(--surface);border-bottom:2px solid var(--red);flex-shrink:0;}
.nav-tab{flex:1;padding:12px 0;border:none;background:transparent;color:var(--dim);font-size:14px;font-weight:700;letter-spacing:.5px;transition:all .2s;border-bottom:3px solid transparent;margin-bottom:-2px;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

#app{display:flex;flex-direction:column;height:100vh;}
.page{display:none;flex:1;overflow:hidden;flex-direction:column;}
.page.active{display:flex;}

/* POS HEADER */
#pos-header{background:var(--surface);padding:7px 11px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border);}
#logo{font-size:15px;font-weight:900;color:var(--gold);}
#type-btns{display:flex;gap:4px;}
.type-btn{padding:5px 10px;border-radius:20px;border:2px solid transparent;color:#fff;font-weight:700;font-size:12px;transition:all .15s;}
.type-btn.active{border-color:#fff;transform:scale(1.05);}
#clock{color:var(--dim);font-size:12px;white-space:nowrap;}

/* CATEGORY TABS */
#cat-tabs{display:flex;gap:5px;padding:6px 9px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
#cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{padding:6px 12px;border-radius:20px;border:none;font-weight:700;font-size:12px;white-space:nowrap;flex-shrink:0;color:var(--dim);background:rgba(255,255,255,.07);}
.cat-tab.active{color:#1a1a2e;}
/* HOT tab special */
.cat-tab-hot{background:linear-gradient(135deg,#f5a623,#e67e22)!important;color:#1a1a2e!important;}

/* MENU GRID */
#pos-main{display:flex;flex:1;overflow:hidden;}
#menu-wrap{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;align-content:start;scrollbar-width:none;padding-bottom:60px;}
#menu-wrap::-webkit-scrollbar{display:none;}
.menu-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.07);border-radius:11px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:68px;justify-content:space-between;position:relative;transition:background .1s,border .1s;user-select:none;}
.menu-card.in-order{border-color:var(--item-color,var(--gold));}
.menu-card-name{font-weight:700;font-size:12px;line-height:1.3;color:var(--text);}
.menu-card-price{font-weight:900;font-size:14px;color:var(--gold);}
.card-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;font-weight:700;display:none;}
.menu-card.in-order .card-badge{display:block;}
/* hot item star */
.hot-star{position:absolute;top:4px;left:4px;font-size:10px;}

/* ORDER PANEL */
#order-panel{width:100%;background:var(--surface);display:flex;flex-direction:column;position:fixed;bottom:0;left:0;z-index:50;border-top:2px solid rgba(255,255,255,.1);transition:height .25s ease;height:50px;overflow:hidden;}
#order-panel.expanded{height:62vh;}
#order-toggle{background:var(--card);padding:8px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-shrink:0;}
#order-count-badge{background:var(--red);color:#fff;border-radius:12px;padding:2px 9px;font-size:11px;}
#order-toggle-right{font-size:16px;transition:transform .25s;}
#order-panel.expanded #order-toggle-right{transform:rotate(180deg);}
#order-list{flex:1;overflow-y:auto;padding:7px;scrollbar-width:none;}
#order-list::-webkit-scrollbar{display:none;}
.order-item{display:flex;align-items:flex-start;gap:5px;background:rgba(255,255,255,.04);border-radius:9px;padding:7px 9px;margin-bottom:5px;border:1px solid var(--border);}
.order-item-info{flex:1;min-width:0;}
.order-item-name{font-size:12px;font-weight:500;line-height:1.3;}
.order-item-note{font-size:10px;color:var(--mint);margin-top:2px;}
.qty-controls{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.qty-btn{width:24px;height:24px;border-radius:50%;border:none;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;}
.qty-minus{background:rgba(233,69,96,.3);color:var(--red);}
.qty-plus{background:rgba(61,232,200,.3);color:var(--mint);}
.qty-num{font-weight:700;min-width:16px;text-align:center;font-size:13px;}
.order-item-price{color:var(--gold);font-weight:700;min-width:44px;text-align:right;font-size:12px;flex-shrink:0;}
#order-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70px;color:#444;gap:5px;font-size:13px;}
#order-footer{border-top:1px solid var(--border);padding:8px 12px;flex-shrink:0;}
.price-row{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-bottom:3px;}
.price-row.total{font-size:16px;font-weight:900;color:var(--gold);border-top:1px solid rgba(255,255,255,.08);padding-top:6px;margin-top:3px;margin-bottom:8px;}
#footer-btns{display:flex;gap:7px;}
#btn-clear{flex:1;padding:10px;background:rgba(233,69,96,.15);border:1px solid var(--red);color:var(--red);border-radius:9px;font-weight:700;font-size:13px;}
#btn-checkout{flex:2;padding:10px;background:linear-gradient(135deg,var(--gold),#e67e22);border:none;color:#fff;border-radius:9px;font-weight:900;font-size:14px;letter-spacing:1px;}
#btn-checkout:disabled{background:#333;cursor:not-allowed;}

/* MODALS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:200;}
.overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:18px;padding:22px;min-width:270px;max-width:88vw;border:1px solid var(--border);}

/* QTY MODAL (long press) */
#modal-name{font-size:17px;font-weight:900;margin-bottom:3px;}
#modal-price{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:14px;}
#modal-qty-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px;}
.modal-qty-btn{width:44px;height:44px;border-radius:50%;border:none;font-size:22px;font-weight:700;}
#modal-qty{font-size:32px;font-weight:900;min-width:48px;text-align:center;}
/* NOTE BUTTONS */
.note-section{margin-bottom:14px;}
.note-label{font-size:11px;color:var(--dim);margin-bottom:7px;font-weight:500;}
.note-btns{display:flex;flex-wrap:wrap;gap:6px;}
.note-btn{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:12px;font-weight:700;transition:all .15s;}
.note-btn.selected{background:var(--mint);color:#1a1a2e;border-color:var(--mint);}
#modal-btns{display:flex;gap:9px;}
#modal-cancel{flex:1;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--dim);border-radius:11px;font-weight:700;font-size:13px;}
#modal-confirm{flex:2;padding:11px;background:linear-gradient(135deg,var(--mint),var(--green));border:none;color:#1a1a2e;border-radius:11px;font-weight:900;font-size:14px;}

/* CHECKOUT MODAL */
#checkout-box{text-align:center;}
#checkout-icon{font-size:48px;margin-bottom:6px;}
#checkout-total{font-size:38px;font-weight:900;color:var(--gold);}
#checkout-label{color:var(--dim);font-size:12px;margin:4px 0 10px;}
#checkout-list{background:rgba(255,255,255,.04);border-radius:11px;padding:8px;max-height:160px;overflow-y:auto;text-align:left;margin-bottom:10px;scrollbar-width:none;}
.checkout-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05);}
.checkout-note{font-size:10px;color:var(--mint);}
#btn-confirm-order{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#e67e22);border:none;color:#fff;border-radius:12px;font-size:15px;font-weight:900;margin-bottom:7px;letter-spacing:1px;}
#btn-back{width:100%;padding:9px;background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--dim);border-radius:11px;font-weight:700;font-size:13px;}

/* TOAST */
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--mint);color:#1a1a2e;padding:8px 18px;border-radius:28px;font-weight:700;font-size:13px;z-index:400;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;}
#toast.show{opacity:1;}

/* ═══ REPORT ═══ */
#report-page{overflow-y:auto;padding-bottom:20px;}
#report-header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 13px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;flex-shrink:0;position:sticky;top:0;z-index:10;}
.period-tabs{display:flex;gap:3px;background:var(--bg);border-radius:9px;padding:3px;}
.period-tab{padding:7px 14px;border-radius:7px;border:none;background:transparent;color:var(--dim);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;}
.period-tab.active{background:var(--gold);color:#1a1a2e;}
.date-nav{display:flex;align-items:center;gap:7px;}
.nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:29px;height:29px;border-radius:7px;font-size:15px;display:flex;align-items:center;justify-content:center;}
#date-label{font-weight:700;font-size:13px;min-width:130px;text-align:center;}
#report-content{padding:11px;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--gold));}
.kpi-label{font-size:11px;color:var(--dim);font-weight:500;margin-bottom:5px;}
.kpi-value{font-size:21px;font-weight:900;color:var(--accent,var(--gold));margin-bottom:2px;}
.kpi-sub{font-size:11px;color:var(--dim);}
.kpi-change{font-size:11px;font-weight:700;margin-top:3px;}
.kpi-change.up{color:var(--green);}.kpi-change.down{color:var(--red);}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:11px;}
.chart-title{font-size:12px;font-weight:700;color:var(--dim);margin-bottom:11px;letter-spacing:.5px;}
.chart-wrap{position:relative;height:175px;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:11px;}
.table-title{font-size:12px;font-weight:700;color:var(--dim);margin-bottom:9px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--dim);padding:5px 7px;border-bottom:1px solid var(--border);}
td{padding:7px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03);}
tr:last-child td{border-bottom:none;}
.rank{color:var(--dim);font-size:11px;width:22px;}
.rank-1{color:var(--gold);font-weight:900;}.rank-2{color:#c0c0c0;font-weight:700;}.rank-3{color:#cd7f32;font-weight:700;}
.mini-bar{height:4px;border-radius:3px;background:var(--border);margin-top:3px;}
.mini-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--mint));}
.amount{color:var(--gold);font-weight:700;text-align:right;}
.real-badge{display:inline-block;background:rgba(61,232,200,.2);color:var(--mint);border:1px solid var(--mint);border-radius:7px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:middle;}
.sim-badge{display:inline-block;background:rgba(139,148,158,.12);color:var(--dim);border:1px solid var(--dim);border-radius:7px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:middle;}
.today-live{background:rgba(61,232,200,.07);border:1px solid rgba(61,232,200,.2);border-radius:12px;padding:11px;margin-bottom:11px;}
.live-title{font-size:12px;color:var(--mint);font-weight:700;margin-bottom:7px;}
.live-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.live-item{background:var(--card);border-radius:9px;padding:9px;}
.live-item-label{font-size:10px;color:var(--dim);margin-bottom:2px;}
.live-item-val{font-size:17px;font-weight:900;color:var(--mint);}
</style>
</head>
<body>
<div id="app">
  <div id="nav">
    <button class="nav-tab active" onclick="showPage('pos',this)">🍽 點餐</button>
    <button class="nav-tab" onclick="showPage('report',this)">📊 報表</button>
  </div>

  <!-- POS PAGE -->
  <div class="page active" id="pos-page">
    <div id="pos-header">
      <div id="logo">🦢 鵝肉點餐</div>
      <div id="type-btns">
        <button class="type-btn active" style="background:#e94560" onclick="setType(this,'外帶')">外帶</button>
        <button class="type-btn" style="background:#7b68ee" onclick="setType(this,'內用')">內用</button>
        <button class="type-btn" style="background:#3498db" onclick="setType(this,'自取')">自取</button>
        <button class="type-btn" style="background:#f39c12" onclick="setType(this,'外送')">外送</button>
      </div>
      <span id="clock"></span>
    </div>
    <div id="cat-tabs"></div>
    <div id="pos-main">
      <div id="menu-wrap"></div>
    </div>
    <div id="order-panel">
      <div id="order-toggle" onclick="toggleOrder()">
        <div>🛒&nbsp;<span id="order-count-badge">共 0 項</span></div>
        <div>
          <span id="order-total-inline" style="color:var(--gold);font-weight:900;font-size:13px;margin-right:6px;">$0</span>
          <span id="order-toggle-right">▲</span>
        </div>
      </div>
      <div id="order-list"><div id="order-empty">🍽️<br>尚未點餐</div></div>
      <div id="order-footer">
        <div class="price-row"><span>小計</span><span id="subtotal">$0</span></div>
        <div class="price-row"><span>服務費</span><span>$0</span></div>
        <div class="price-row total"><span>總金額</span><span id="total">$0</span></div>
        <div id="footer-btns">
          <button id="btn-clear" onclick="clearOrder()">清除</button>
          <button id="btn-checkout" onclick="quickCheckout()" disabled>⚡ 快速結帳</button>
        </div>
      </div>
    </div>
  </div>

  <!-- REPORT PAGE -->
  <div class="page" id="report-page">
    <div id="report-header">
      <div class="period-tabs">
        <button class="period-tab active" onclick="setPeriod('day',this)">日報</button>
        <button class="period-tab" onclick="setPeriod('week',this)">週報</button>
        <button class="period-tab" onclick="setPeriod('month',this)">月報</button>
      </div>
      <div class="date-nav">
        <button class="nav-btn" onclick="navigate(-1)">‹</button>
        <div id="date-label"></div>
        <button class="nav-btn" onclick="navigate(1)">›</button>
      </div>
    </div>
    <div id="report-content"></div>
  </div>
</div>

<!-- QTY + NOTE MODAL (long press) -->
<div class="overlay" id="item-overlay" onclick="overlayClick(event,'item-overlay')">
  <div class="modal-box">
    <div id="modal-name"></div>
    <div id="modal-price"></div>
    <div id="modal-qty-row">
      <button class="modal-qty-btn" style="background:rgba(233,69,96,.3);color:#e94560;" onclick="changeModalQty(-1)">−</button>
      <div id="modal-qty">1</div>
      <button class="modal-qty-btn" style="background:rgba(61,232,200,.3);color:#3de8c8;" onclick="changeModalQty(1)">+</button>
    </div>
    <div class="note-section">
      <div class="note-label">📝 備註（可複選）</div>
      <div class="note-btns" id="note-btns"></div>
    </div>
    <div id="modal-btns">
      <button id="modal-cancel" onclick="closeOverlay('item-overlay')">取消</button>
      <button id="modal-confirm" onclick="confirmAdd()">加入訂單</button>
    </div>
  </div>
</div>

<!-- CHECKOUT CONFIRM -->
<div class="overlay" id="checkout-overlay" onclick="overlayClick(event,'checkout-overlay')">
  <div class="modal-box" id="checkout-box">
    <div id="checkout-icon">🧾</div>
    <div id="checkout-total">$0</div>
    <div id="checkout-label">請確認訂單內容</div>
    <div id="checkout-list"></div>
    <button id="btn-confirm-order" onclick="confirmOrder()">✓ 確認送出</button>
    <button id="btn-back" onclick="closeOverlay('checkout-overlay')">返回修改</button>
  </div>
</div>

<div id="toast"></div>

// ── Menu ──────────────────────────────────────────────────────
function renderMenu(){
  const wrap=document.getElementById('menu-wrap');
  wrap.innerHTML='';
  const data=MENU[currentCat];
  data.items.forEach(item=>{
    const inO=order.find(o=>o.name===item.name);
    const card=document.createElement('div');
    card.className='menu-card'+(inO?' in-order':'');
    card.style.setProperty('--item-color',data.color);
    if(inO) card.style.borderColor=data.color;
    const hotRank=Object.keys(clickCount).sort((a,b)=>clickCount[b]-clickCount[a]).indexOf(item.name);
    const star=data.hot&&hotRank<3?['🥇','🥈','🥉'][hotRank]:'';
    card.innerHTML=`
      ${star?`<div class="hot-star">${star}</div>`:''}
      <div class="card-badge">${inO?'×'+inO.qty:''}</div>
      <div class="menu-card-name">${item.name}</div>
      <div class="menu-card-price">${item.price?'$'+item.price:'時價'}</div>`;
    // single tap → add 1 immediately
    card.addEventListener('click', ()=>quickAdd({...item,cat:currentCat!=='熱門快選'?currentCat:item.cat||findCat(item.name)}));
    // long press → open qty+note modal
    card.addEventListener('pointerdown',()=>{
      longPressTimer=setTimeout(()=>{
        longPressTimer=null;
        openModal({...item,cat:currentCat!=='熱門快選'?currentCat:item.cat||findCat(item.name)});
      },500);
    });
    card.addEventListener('pointerup',()=>clearTimeout(longPressTimer));
    card.addEventListener('pointerleave',()=>clearTimeout(longPressTimer));
    wrap.appendChild(card);
  });
}

function findCat(name){
  for(const[cat,d] of Object.entries(MENU)){
    if(cat==='熱門快選') continue;
    if(d.items.find(i=>i.name===name)) return cat;
  }
  return '其他';
}

// ── Quick add (1 tap = +1, no modal) ─────────────────────────

  const ex=order.find(o=>o.name===item.name);
  if(ex) ex.qty++;
  else order.push({...item,qty:1,notes:[]});

  showToast('＋1  '+item.name);
}

function saveOrder(items,type){

//  REPORT ENGINE

let period='day',cursor=new Date(),rCharts={};
cursor.setHours(0,0,0,0);

function seeded(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return(s-1)/2147483646;};}
function genFakeDay(date){
  const r=seeded(date.getFullYear()*10000+date.getMonth()*100+date.getDate());
  const isWeekend=date.getDay()===0||date.getDay()===6;
  const allItems=Object.entries(MENU).filter(([c])=>c!=='熱門快選').flatMap(([cat,d])=>d.items.map(i=>({...i,cat})));
  const orders=[];
  const cnt=Math.round((isWeekend?100:70)+r()*40);
  for(let i=0;i<cnt;i++){
    const type=TYPES[Math.floor(r()*4)];
    const hour=Math.floor(r()<0.6?r()*4+10:r()*5+16);
    const ic=Math.floor(r()*3)+1;
    const oi=[];
    for(let j=0;j<ic;j++){const it=allItems[Math.floor(r()*allItems.length)];const ex=oi.find(o=>o.name===it.name);if(ex)ex.qty++;else oi.push({...it,qty:1,notes:[]});}
    orders.push({hour,type,items:oi,total:oi.reduce((s,it)=>s+it.price*it.qty,0)});
  }
  return orders;
}

function getOrdersForDate(date){
  const key=dateKey(date);
  if(key===todayKey()) return realOrders[key]||[];
  return genFakeDay(date);
}
function aggOrders(orders){
  const rev=orders.reduce((s,o)=>s+o.total,0);
  const cnt=orders.length;
  const avg=cnt?Math.round(rev/cnt):0;
  const byHour={};HOURS.forEach(h=>byHour[h]=0);
  orders.forEach(o=>{byHour[o.hour]=(byHour[o.hour]||0)+o.total;});
  const byType={};TYPES.forEach(t=>byType[t]=0);
  orders.forEach(o=>{byType[o.type]=(byType[o.type]||0)+1;});
  const byCat={};
  orders.forEach(o=>o.items.forEach(it=>{byCat[it.cat]=(byCat[it.cat]||0)+it.price*it.qty;}));
  const byItem={};
  orders.forEach(o=>o.items.forEach(it=>{
    if(!byItem[it.name])byItem[it.name]={qty:0,rev:0,price:it.price,cat:it.cat};
    byItem[it.name].qty+=it.qty;byItem[it.name].rev+=it.price*it.qty;
  }));
  return{rev,cnt,avg,byHour,byType,byCat,byItem};
}
function getMonday(d){const c=new Date(d),day=c.getDay(),diff=c.getDate()-day+(day===0?-6:1);c.setDate(diff);return c;}
function mergeDays(days){
  const c={rev:0,cnt:0,byHour:{},byType:{},byCat:{},byItem:{}};
  HOURS.forEach(h=>c.byHour[h]=0);TYPES.forEach(t=>c.byType[t]=0);
  days.forEach(({agg:a})=>{
    c.rev+=a.rev;c.cnt+=a.cnt;
    HOURS.forEach(h=>c.byHour[h]+=a.byHour[h]||0);
    TYPES.forEach(t=>c.byType[t]+=a.byType[t]||0);
    Object.entries(a.byCat).forEach(([k,v])=>{c.byCat[k]=(c.byCat[k]||0)+v;});
    Object.entries(a.byItem).forEach(([k,v])=>{
      if(!c.byItem[k])c.byItem[k]={qty:0,rev:0,price:v.price,cat:v.cat};
      c.byItem[k].qty+=v.qty;c.byItem[k].rev+=v.rev;
    });
  });
  c.avg=c.cnt?Math.round(c.rev/c.cnt):0;return c;
}
function getPeriodData(){
  if(period==='day'){
    const agg=aggOrders(getOrdersForDate(cursor));
    const prev=new Date(cursor);prev.setDate(prev.getDate()-1);
    const prevAgg=aggOrders(getOrdersForDate(prev));
    const isToday=dateKey(cursor)===todayKey();
    return{agg,prevAgg,days:null,isToday,realCount:(realOrders[todayKey()]||[]).length};
  }
  if(period==='week'){
    const mon=getMonday(cursor);
    const days=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return{date:d,agg:aggOrders(getOrdersForDate(d))};});
    const prevMon=new Date(mon);prevMon.setDate(prevMon.getDate()-7);
    let prevRev=0;for(let i=0;i<7;i++){const d=new Date(prevMon);d.setDate(d.getDate()+i);prevRev+=aggOrders(getOrdersForDate(d)).rev;}
    return{agg:mergeDays(days),prevAgg:{rev:prevRev},days,isToday:false};
  }
  const y=cursor.getFullYear(),m=cursor.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const days=Array.from({length:dim},(_,i)=>{const d=new Date(y,m,i+1);return{date:d,agg:aggOrders(getOrdersForDate(d))};});
  let prevRev=0;const pm=m===0?11:m-1,py=m===0?y-1:y,pdim=new Date(py,pm+1,0).getDate();
  for(let i=1;i<=pdim;i++)prevRev+=aggOrders(genFakeDay(new Date(py,pm,i))).rev;
  return{agg:mergeDays(days),prevAgg:{rev:prevRev},days,isToday:false};
}
function periodLabel(){
  if(period==='day')return cursor.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  if(period==='week'){const mon=getMonday(cursor);const sun=new Date(mon);sun.setDate(sun.getDate()+6);return mon.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})+'–'+sun.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'});}
  return cursor.getFullYear()+'年'+(cursor.getMonth()+1)+'月';
}
function setPeriod(p,btn){period=p;document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderReport();}
function navigate(dir){
  if(period==='day')cursor.setDate(cursor.getDate()+dir);
  else if(period==='week')cursor.setDate(cursor.getDate()+dir*7);
  else cursor.setMonth(cursor.getMonth()+dir);
  renderReport();
}
function fmtM(n){return'$'+n.toLocaleString();}
function pct(a,b){if(!b)return'0.0';return((a-b)/b*100).toFixed(1);}
function bestHour(bh){const b=Object.entries(bh).sort((a,b)=>b[1]-a[1])[0];return b?b[0]+'時':'–';}

function renderReport(){
  document.getElementById('date-label').textContent=periodLabel();
  const{agg,prevAgg,days,isToday,realCount}=getPeriodData();
  const rc=document.getElementById('report-content');
  const badge=isToday?`<span class="real-badge">LIVE</span>`:`<span class="sim-badge">模擬</span>`;
  const revChg=pct(agg.rev,prevAgg.rev);

  let liveBanner='';
  if(isToday) liveBanner=`<div class="today-live">
    <div class="live-title">⚡ 今日即時 <span class="real-badge">LIVE</span></div>
    <div class="live-grid">
      <div class="live-item"><div class="live-item-label">訂單數</div><div class="live-item-val">${realCount}</div></div>
      <div class="live-item"><div class="live-item-label">營業額</div><div class="live-item-val">${fmtM(agg.rev)}</div></div>
      <div class="live-item"><div class="live-item-label">均單價</div><div class="live-item-val">${fmtM(agg.avg)}</div></div>
      <div class="live-item"><div class="live-item-label">熱門時段</div><div class="live-item-val">${bestHour(agg.byHour)}</div></div>
    </div></div>`;

  const kpis=[
    {label:'總營業額',value:fmtM(agg.rev),accent:'var(--gold)',sub:'上期 '+fmtM(prevAgg.rev),change:(agg.rev>=prevAgg.rev?'▲':'▼')+' '+Math.abs(revChg)+'%',cls:agg.rev>=prevAgg.rev?'up':'down'},
    {label:'訂單數',value:agg.cnt+'單',accent:'var(--mint)',sub:'均單 '+fmtM(agg.avg)},
    {label:'均單價',value:fmtM(agg.avg),accent:'var(--blue)',sub:''},
    {label:'最熱時段',value:bestHour(agg.byHour),accent:'var(--purple)',sub:''},
  ];
  const kpiHtml=`<div class="kpi-grid">${kpis.map(k=>`<div class="kpi-card" style="--accent:${k.accent}"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div><div class="kpi-sub">${k.sub||''}</div>${k.change?`<div class="kpi-change ${k.cls}">${k.change} vs 上期</div>`:''}</div>`).join('')}</div>`;

  const sorted=Object.entries(agg.byItem).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);
  const maxQ=sorted[0]?sorted[0][1].qty:1;
  const topHtml=`<div class="table-card"><div class="table-title">🏆 熱銷排行 ${badge}</div><table><thead><tr><th>#</th><th>品項</th><th>數量</th><th>營業額</th></tr></thead><tbody>${
    sorted.map(([name,d],i)=>`<tr><td class="rank ${i<3?'rank-'+(i+1):''}">${i+1}</td><td>${name}<div class="mini-bar"><div class="mini-bar-fill" style="width:${d.qty/maxQ*100}%"></div></div></td><td>${d.qty}</td><td class="amount">${fmtM(d.rev)}</td></tr>`).join('')
  }</tbody></table></div>`;

  let trendHtml='';
  if(days){
    const rows=period==='week'?days:days.slice(-14);
    trendHtml=`<div class="table-card"><div class="table-title">📅 ${period==='week'?'本週每日':'近14日'}概況</div><table><thead><tr><th>日期</th><th>單數</th><th>均單</th><th>營業額</th><th>±</th></tr></thead><tbody>${
      rows.map((d,i,arr)=>{
        const prev=i>0?arr[i-1].agg:null;
        const chg=prev?pct(d.agg.rev,prev.rev):null;
        const cls=prev?(d.agg.rev>=prev.rev?'up':'down'):'';
        const isRealDay=dateKey(d.date)===todayKey();
        const ds=period==='week'?d.date.toLocaleDateString('zh-TW',{weekday:'short',month:'numeric',day:'numeric'}):d.date.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'});
        return`<tr style="${isRealDay?'background:rgba(61,232,200,.07)':''}"><td>${ds}${isRealDay?'<span class="real-badge">今日</span>':''}</td><td>${d.agg.cnt}</td><td>${fmtM(d.agg.avg)}</td><td class="amount">${fmtM(d.agg.rev)}</td><td>${chg!==null?`<span class="kpi-change ${cls}" style="font-size:11px">${Number(chg)>=0?'▲':'▼'} ${Math.abs(chg)}%</span>`:'-'}</td></tr>`;
      }).join('')
    }</tbody></table></div>`;
  }

  rc.innerHTML=liveBanner+kpiHtml+`
    <div class="chart-card">
      <div class="chart-title">${period==='day'?'⏱ 各時段':'📅 各日'}營業額 ${badge}</div>
      <div class="chart-wrap"><canvas id="rc-rev"></canvas></div>
    </div>
    <div class="charts-row">
      <div class="chart-card" style="margin-bottom:0"><div class="chart-title">🍜 品類佔比</div><div class="chart-wrap"><canvas id="rc-cat"></canvas></div></div>
      <div class="chart-card" style="margin-bottom:0"><div class="chart-title">🛍 訂單類型</div><div class="chart-wrap"><canvas id="rc-type"></canvas></div></div>
    </div>`+topHtml+trendHtml;

  setTimeout(()=>{
    let revL,revD;
    if(period==='day'){revL=HOURS.map(h=>h+'時');revD=HOURS.map(h=>agg.byHour[h]||0);}
    else{revL=days.map(d=>period==='week'?['日','一','二','三','四','五','六'][d.date.getDay()]:(d.date.getDate()+'日'));revD=days.map(d=>d.agg.rev);}
    drawBar('rc-rev',revL,revD,'#f5a623');
    const cl=Object.keys(agg.byCat),cv=cl.map(k=>agg.byCat[k]),cc=cl.map(k=>CAT_COLORS[k]||'#888');
    drawDonut('rc-cat',cl,cv,cc);
    drawDonut('rc-type',TYPES,TYPES.map(t=>agg.byType[t]||0),TYPE_COLORS);
  },50);
}

function drawBar(id,labels,data,color){
  const el=document.getElementById(id);if(!el)return;
  if(rCharts[id])rCharts[id].destroy();
  const ctx=el.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,175);grad.addColorStop(0,color+'cc');grad.addColorStop(1,color+'22');
  rCharts[id]=new Chart(ctx,{type:'bar',data:{labels,datasets:[{data,backgroundColor:grad,borderColor:color,borderWidth:1.5,borderRadius:5}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#8b949e',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#8b949e',font:{size:10},callback:v=>'$'+v.toLocaleString()}}},animation:{duration:300}}});
}
function drawDonut(id,labels,data,colors){
  const el=document.getElementById(id);if(!el)return;
  if(rCharts[id])rCharts[id].destroy();
  rCharts[id]=new Chart(el.getContext('2d'),{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#1c2333'}]},
    options:{plugins:{legend:{display:true,position:'right',labels:{color:'#8b949e',font:{size:10},boxWidth:10,padding:5}}},cutout:'62%',animation:{duration:300}}});
}
</script>
